name: CI Gate

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-gate:
    name: scripts/ci_gate.sh
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run CI gate
        run: bash scripts/ci_gate.sh

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failureforge-verification-${{ github.run_id }}
          path: reports/failureforge-verification/latest
          if-no-files-found: ignore
          retention-days: 14
