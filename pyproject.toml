[project]
name = "failureforge"
version = "0.10.0"
description = "Sandbox-only failure harvesting and governance bridge artifacts for Forge."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.26,<1.0",
    "jsonschema>=4.21,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# Line length matches the codebase's existing wrap convention (Black-style).
line-length = 88
target-version = "py311"
extend-exclude = ["sandbox", "reports", "doc/FFGSYSTEM.md"]

[tool.ruff.lint]
# Start with the conservative subset: pyflakes, pycodestyle errors, isort,
# bugbear, comprehensions, pyupgrade. Skip stylistic-only rules until the
# tree settles.
select = ["E", "F", "I", "B", "C4", "UP"]
ignore = [
    # Line length handled by formatter, not lint.
    "E501",
    # (str, Enum) -> StrEnum migration is a behavioral change (wire-format
    # serialization, JSON dumping). Defer to a focused slice rather than
    # silently lump it into a lint baseline. Re-enable once the migration
    # ships.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False is fine in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
