[project]
name = "failureforge"
version = "0.10.0"
description = "Sandbox-only failure harvesting and governance bridge artifacts for Forge."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.26,<1.0",
    "jsonschema>=4.21,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
